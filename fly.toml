# Fly.io configuration.
#
# Included because the client may already have a paid Fly organisation. Note that
# Fly removed its free allowances for new accounts: as of 2026 a new org gets a
# trial of 2 VM-hours or 7 days, then requires a card. It is a fine target for
# their own infrastructure, and a poor one for a throwaway demo.
#
#   fly launch --no-deploy --copy-config
#   fly secrets set DATABASE_URL='postgres://...' API_BEARER_TOKEN='...'
#   fly deploy

app = 'store-data-api'
primary_region = 'mad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  LOG_LEVEL = 'info'
  INGEST_WORKER_ENABLED = 'false'
  DEFAULT_COUNTRY = 'us'
  DEFAULT_LANG = 'en'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Zero would mean a cold start on every visit. One machine kept warm costs
  # little and removes the wake-up delay entirely.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
